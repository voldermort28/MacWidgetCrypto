name: Build Crypto Widget

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write


    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install XcodeGen
      run: brew install xcodegen

    - name: Generate Xcode Project
      run: xcodegen generate

    - name: Build macOS App & Widget
      run: |
        PROJECT_FILE=$(find . -name "*.xcodeproj" | head -n 1)

        if [ -z "$PROJECT_FILE" ]; then
          echo "Error: Khong tim thay file .xcodeproj sau khi chay XcodeGen"
          exit 1
        fi

        echo "Building macOS project: $PROJECT_FILE"
        xcodebuild -project "$PROJECT_FILE" \
          -scheme "MacWidgetCrypto" \
          -configuration Release \
          -derivedDataPath build \
          -destination "generic/platform=macOS" \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY="" \
          build

    - name: Build iOS App & Widget
      run: |
        PROJECT_FILE=$(find . -name "*.xcodeproj" | head -n 1)

        if [ -z "$PROJECT_FILE" ]; then
          echo "Error: Khong tim thay file .xcodeproj sau khi chay XcodeGen"
          exit 1
        fi

        echo "Building iOS Simulator project: $PROJECT_FILE"
        xcodebuild -project "$PROJECT_FILE" \
          -scheme "MacWidgetCrypto" \
          -configuration Release \
          -derivedDataPath build \
          -destination "generic/platform=iOS Simulator" \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY="" \
          build

    - name: Package DMG & Zip
      run: |
        RELEASE_DIR="build/Build/Products/Release"
        APP_PATH="$RELEASE_DIR/MacWidgetCrypto.app"

        echo "=== Creating DMG installer ==="
        DMG_TEMP="build/dmg_temp"
        mkdir -p "$DMG_TEMP"
        cp -R "$APP_PATH" "$DMG_TEMP/"
        ln -s /Applications "$DMG_TEMP/Applications"

        hdiutil create -volname "MacWidgetCrypto" \
          -srcfolder "$DMG_TEMP" \
          -ov -format UDZO \
          "$RELEASE_DIR/MacWidgetCrypto.dmg"

        echo "=== Creating ZIP archive ==="
        cd "$RELEASE_DIR"
        zip -r MacWidgetCrypto.app.zip MacWidgetCrypto.app

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Crypto-Widget-App
        path: |
          build/Build/Products/Release/MacWidgetCrypto.dmg
          build/Build/Products/Release/MacWidgetCrypto.app.zip

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: "MacWidgetCrypto v1.0.${{ github.run_number }}"
        body: |
          ## Automated Release v1.0.${{ github.run_number }}
          - **Commit**: `${{ github.sha }}`
          - **Branch**: `${{ github.ref_name }}`
          - **Build**: `${{ github.run_number }}`

          ### Downloads:
          - `MacWidgetCrypto.dmg`: File cài đặt macOS (kéo thả icon vào thư mục Applications)
          - `MacWidgetCrypto.app.zip`: Bản nén ứng dụng macOS (bao gồm CryptoWidget extension)
        files: |
          build/Build/Products/Release/MacWidgetCrypto.dmg
          build/Build/Products/Release/MacWidgetCrypto.app.zip
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


