name: Build macOS Crypto Widget

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: List files (Để kiểm tra tên file dự án)
      run: ls -R

    - name: Set up Xcode version
      run: sudo xcode-select -s /Applications/Xcode_15.2.app/Contents/Developer

    - name: Build macOS App & Widget
      run: |
        # Tự động tìm file .xcodeproj nếu bạn không nhớ tên chính xác
        PROJECT_FILE=$(ls -d *.xcodeproj | head -n 1)
        
        # Build dự án (Bỏ qua ký tên để build online thành công)
        xcodebuild -project "$PROJECT_FILE" \
          -alltargets \
          -configuration Release \
          -destination "platform=macOS" \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY="" \
          build

    - name: Compress App for Download
      run: |
        # Tìm file .app trong thư mục Build và nén lại
        cd build/Build/Products/Release/
        zip -r macOS-Widget.zip *.app

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: macOS-Widget-Build
        path: build/Build/Products/Release/macOS-Widget.zip
