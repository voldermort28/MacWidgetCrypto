name: Build Crypto Widget

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write


    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install XcodeGen
      run: brew install xcodegen

    - name: Generate Xcode Project
      run: xcodegen generate

    - name: Build macOS App & Widget
      run: |
        PROJECT_FILE=$(find . -name "*.xcodeproj" | head -n 1)

        if [ -z "$PROJECT_FILE" ]; then
          echo "Error: Khong tim thay file .xcodeproj sau khi chay XcodeGen"
          exit 1
        fi

        echo "Building macOS project: $PROJECT_FILE"
        xcodebuild -project "$PROJECT_FILE" \
          -scheme "MacWidgetCrypto" \
          -configuration Release \
          -derivedDataPath build \
          -destination "generic/platform=macOS" \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY="" \
          build

        echo "Applying ad-hoc code signing with entitlements for macOS app and widget..."
        codesign --force --sign - --entitlements "MacWidgetCrypto/Widget/CryptoWidget.entitlements" "build/Build/Products/Release/MacWidgetCrypto.app/Contents/PlugIns/CryptoWidget.appex"
        codesign --force --sign - --entitlements "MacWidgetCrypto/App/MacWidgetCrypto.entitlements" "build/Build/Products/Release/MacWidgetCrypto.app"

    - name: Build iOS App & Widget (IPA for TrollStore)
      run: |
        PROJECT_FILE=$(find . -name "*.xcodeproj" | head -n 1)

        if [ -z "$PROJECT_FILE" ]; then
          echo "Error: Khong tim thay file .xcodeproj sau khi chay XcodeGen"
          exit 1
        fi

        echo "Building iOS Device project: $PROJECT_FILE"
        xcodebuild -project "$PROJECT_FILE" \
          -scheme "MacWidgetCrypto" \
          -configuration Release \
          -derivedDataPath build_ios \
          -destination "generic/platform=iOS" \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY="" \
          build

        echo "Packaging iOS IPA for TrollStore..."
        mkdir -p build_ios/Payload
        cp -R build_ios/Build/Products/Release-iphoneos/MacWidgetCrypto.app build_ios/Payload/
        codesign --force --sign - --entitlements "MacWidgetCrypto/Widget/CryptoWidget.entitlements" "build_ios/Payload/MacWidgetCrypto.app/PlugIns/CryptoWidget.appex"
        codesign --force --sign - --entitlements "MacWidgetCrypto/App/MacWidgetCrypto.entitlements" "build_ios/Payload/MacWidgetCrypto.app"
        cd build_ios
        zip -r MacWidgetCrypto.ipa Payload


    - name: Package DMG, PKG & Zip for macOS
      run: |
        RELEASE_DIR="build/Build/Products/Release"
        APP_PATH="$RELEASE_DIR/MacWidgetCrypto.app"

        echo "=== Creating 1-Click Installer script for DMG ==="
        DMG_TEMP="build/dmg_temp"
        mkdir -p "$DMG_TEMP"
        cp -R "$APP_PATH" "$DMG_TEMP/"
        ln -s /Applications "$DMG_TEMP/Applications"

        cat << 'EOF' > "$DMG_TEMP/Cai_Dat_Va_Kich_Hoat_Widget.command"
#!/bin/bash
DIR="$( cd "$( dirname "${BASH_SOURCE[0]}" )" && pwd )"
echo "======================================================"
echo "    Cài đặt MacWidgetCrypto & Tự động Kích hoạt Widget"
echo "======================================================"
echo "1. Đang sao chép MacWidgetCrypto vào /Applications..."
cp -R "$DIR/MacWidgetCrypto.app" /Applications/
echo "2. Đang gỡ bỏ cờ cách ly macOS (quarantine)..."
xattr -cr /Applications/MacWidgetCrypto.app
echo "3. Đang làm mới hệ thống Widget (chronod)..."
killall chronod 2>/dev/null || true
killall NotificationCenter 2>/dev/null || true
echo "4. Đang mở ứng dụng..."
open /Applications/MacWidgetCrypto.app
echo ""
echo "✅ Hoàn tất! Widget đã sẵn sàng trong Edit Widgets."
echo ""
sleep 2
exit 0
EOF
        chmod +x "$DMG_TEMP/Cai_Dat_Va_Kich_Hoat_Widget.command"

        echo "=== Creating DMG installer ==="
        hdiutil create -volname "MacWidgetCrypto" \
          -srcfolder "$DMG_TEMP" \
          -ov -format UDZO \
          "$RELEASE_DIR/MacWidgetCrypto.dmg"

        echo "=== Creating PKG installer (Automated postinstall) ==="
        PKG_ROOT="build/pkg_root"
        mkdir -p "$PKG_ROOT/Applications"
        cp -R "$APP_PATH" "$PKG_ROOT/Applications/"

        PKG_SCRIPTS="build/pkg_scripts"
        mkdir -p "$PKG_SCRIPTS"
        cat << 'EOF' > "$PKG_SCRIPTS/postinstall"
#!/bin/bash
xattr -cr /Applications/MacWidgetCrypto.app 2>/dev/null || true
killall chronod 2>/dev/null || true
killall NotificationCenter 2>/dev/null || true
exit 0
EOF
        chmod +x "$PKG_SCRIPTS/postinstall"

        pkgbuild --root "$PKG_ROOT" \
          --identifier "com.voldermort28.MacWidgetCrypto" \
          --version "1.0.${{ github.run_number }}" \
          --scripts "$PKG_SCRIPTS" \
          "$RELEASE_DIR/MacWidgetCrypto.pkg"

        echo "=== Creating ZIP archive ==="
        cd "$RELEASE_DIR"
        zip -r MacWidgetCrypto.app.zip MacWidgetCrypto.app

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Crypto-Widget-App
        path: |
          build/Build/Products/Release/MacWidgetCrypto.dmg
          build/Build/Products/Release/MacWidgetCrypto.pkg
          build/Build/Products/Release/MacWidgetCrypto.app.zip
          build_ios/MacWidgetCrypto.ipa

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: "MacWidgetCrypto v1.0.${{ github.run_number }}"
        body: |
          ## Automated Release v1.0.${{ github.run_number }}
          - **Commit**: `${{ github.sha }}`
          - **Branch**: `${{ github.ref_name }}`
          - **Build**: `${{ github.run_number }}`

          ### 📦 File Tải Về:
          - ⚙️ `MacWidgetCrypto.pkg`: **Bộ cài đặt tự động 1-Click (Khuyên dùng cho macOS)** — Tự động cài vào Applications, gỡ cờ cách ly và kích hoạt widget ngay lập tức, không cần gõ lệnh.
          - 💿 `MacWidgetCrypto.dmg`: Bản kéo-thả truyền thống (có kèm sẵn file `Cai_Dat_Va_Kich_Hoat_Widget.command` bên trong để click đúp chạy tự động).
          - 📦 `MacWidgetCrypto.app.zip`: Bản zip ứng dụng macOS.
          - 📱 `MacWidgetCrypto.ipa`: Bản cài đặt cho iPhone/iPad (dành cho TrollStore / AltStore / Sideloadly).
        files: |
          build/Build/Products/Release/MacWidgetCrypto.pkg
          build/Build/Products/Release/MacWidgetCrypto.dmg
          build/Build/Products/Release/MacWidgetCrypto.app.zip
          build_ios/MacWidgetCrypto.ipa
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}



