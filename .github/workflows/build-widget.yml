name: Build macOS Crypto Widget

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Show Available Xcodes
      run: ls /Applications | grep Xcode

    - name: Build macOS App & Widget
      run: |
        # Tự động tìm file dự án .xcodeproj
        PROJECT_FILE=$(ls -d *.xcodeproj | head -n 1)
        echo "Building project: $PROJECT_FILE"
        
        # Build và bỏ qua bước ký tên (Signing)
        xcodebuild -project "$PROJECT_FILE" \
          -alltargets \
          -configuration Release \
          -destination "platform=macOS" \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY="" \
          build

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Crypto-Widget-App
        path: build/Build/Products/Release/*.app