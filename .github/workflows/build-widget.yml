name: Build macOS Crypto Widget

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install XcodeGen
      run: brew install xcodegen

    - name: Generate Xcode Project
      run: xcodegen generate

    - name: Build macOS App & Widget
      run: |
        xcodebuild -project MacWidgetCrypto.xcodeproj \
          -scheme MacWidgetCrypto \
          -configuration Release \
          -destination "platform=macOS" \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY="" \
          build

    - name: Zip App
      run: |
        cd build/Build/Products/Release/
        zip -r MacWidgetCrypto.app.zip MacWidgetCrypto.app

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Crypto-Widget-App
        path: build/Build/Products/Release/MacWidgetCrypto.app.zip