name: Build Crypto Widget

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install XcodeGen
      run: brew install xcodegen

    - name: Generate Xcode Project
      run: xcodegen generate

    - name: Build macOS App & Widget
      run: |
        PROJECT_FILE=$(find . -name "*.xcodeproj" | head -n 1)

        if [ -z "$PROJECT_FILE" ]; then
          echo "Error: Khong tim thay file .xcodeproj sau khi chay XcodeGen"
          exit 1
        fi

        echo "Building macOS project: $PROJECT_FILE"
        xcodebuild -project "$PROJECT_FILE" \
          -scheme "MacWidgetCrypto" \
          -configuration Release \
          -derivedDataPath build \
          -destination "generic/platform=macOS" \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY="" \
          build

    - name: Build iOS App & Widget
      run: |
        PROJECT_FILE=$(find . -name "*.xcodeproj" | head -n 1)

        if [ -z "$PROJECT_FILE" ]; then
          echo "Error: Khong tim thay file .xcodeproj sau khi chay XcodeGen"
          exit 1
        fi

        echo "Building iOS Simulator project: $PROJECT_FILE"
        xcodebuild -project "$PROJECT_FILE" \
          -scheme "MacWidgetCrypto" \
          -configuration Release \
          -derivedDataPath build \
          -destination "generic/platform=iOS Simulator" \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY="" \
          build

    - name: Zip App
      run: |
        cd build/Build/Products/Release/
        zip -r MacWidgetCrypto.app.zip MacWidgetCrypto.app

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Crypto-Widget-App
        path: build/Build/Products/Release/MacWidgetCrypto.app.zip
