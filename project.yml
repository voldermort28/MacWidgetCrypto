name: MacWidgetCrypto
options:
  bundleIdPrefix: com.voldermort28
  deploymentTarget:
    macOS: "14.0"
    iOS: "15.5"
targets:
  MacWidgetCrypto:
    type: application
    platform: auto
    supportedDestinations: [macOS, iOS]
    deploymentTarget:
      macOS: "14.0"
      iOS: "15.5"
    sources:
      - path: MacWidgetCrypto/App
      - path: MacWidgetCrypto/Shared
    dependencies:
      - target: CryptoWidget
    info:
      path: MacWidgetCrypto/App/Info.plist
    entitlements:
      path: MacWidgetCrypto/App/MacWidgetCrypto.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.voldermort28.MacWidgetCrypto
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: MacWidgetCrypto/App/MacWidgetCrypto.entitlements

  CryptoWidget:
    type: app-extension
    platform: auto
    supportedDestinations: [macOS, iOS]
    deploymentTarget:
      macOS: "14.0"
      iOS: "15.5"
    sources:
      - path: MacWidgetCrypto/Widget
      - path: MacWidgetCrypto/Shared
    info:
      path: MacWidgetCrypto/Widget/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: MacWidgetCrypto/Widget/CryptoWidget.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.voldermort28.MacWidgetCrypto.CryptoWidget
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: MacWidgetCrypto/Widget/CryptoWidget.entitlements

