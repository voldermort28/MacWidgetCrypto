name: MacWidgetCrypto
options:
  bundleIdPrefix: com.voldermort28
  deploymentTarget:
    macOS: "14.0"
    iOS: "15.5"
targets:
  MacWidgetCrypto:
    type: application
    platform: auto
    supportedDestinations: [macOS, iOS]
    deploymentTarget:
      macOS: "14.0"
      iOS: "15.5"
    sources:
      - path: MacWidgetCrypto/App
      - path: MacWidgetCrypto/Shared
    dependencies:
      - target: CryptoWidget
        embed: true

    info:
      path: MacWidgetCrypto/App/Info.plist
      properties:
        CFBundleDisplayName: "MacWidgetCrypto"
    entitlements:
      path: MacWidgetCrypto/App/MacWidgetCrypto.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.application-groups:
          - group.com.voldermort28.MacWidgetCrypto
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.voldermort28.MacWidgetCrypto
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: MacWidgetCrypto/App/MacWidgetCrypto.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  CryptoWidget:
    type: app-extension
    platform: auto
    supportedDestinations: [macOS, iOS]
    deploymentTarget:
      macOS: "14.0"
      iOS: "15.5"
    sources:
      - path: MacWidgetCrypto/Widget
      - path: MacWidgetCrypto/Shared
    info:
      path: MacWidgetCrypto/Widget/Info.plist
      properties:
        CFBundleDisplayName: "Crypto Portfolio"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: MacWidgetCrypto/Widget/CryptoWidget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.application-groups:
          - group.com.voldermort28.MacWidgetCrypto
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.voldermort28.MacWidgetCrypto.CryptoWidget
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: MacWidgetCrypto/Widget/CryptoWidget.entitlements

